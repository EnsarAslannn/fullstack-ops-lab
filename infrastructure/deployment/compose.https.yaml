services:
  frontend:
    ports: !override
      - "127.0.0.1:18081:80"
      - "127.0.0.1:18443:443"
    volumes:
      - type: bind
        source: ./infrastructure/deployment/nginx/https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DEPLOYMENT_TLS_DIR:?Set DEPLOYMENT_TLS_DIR outside the repository}/server.crt
        target: /etc/nginx/deployment-tls/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DEPLOYMENT_TLS_DIR:?Set DEPLOYMENT_TLS_DIR outside the repository}/server.key
        target: /etc/nginx/deployment-tls/server.key
        read_only: true
        bind:
          create_host_path: false
